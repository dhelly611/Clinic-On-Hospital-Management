<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration - Clinic On Healthcare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);">

  <!-- Nav -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-hospital"></i></div>
        <div class="logo-text">Clinic<span>On</span></div>
      </a>
      <div class="nav-actions">
        <a id="linkLogin" href="patient-login.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-right-to-bracket"></i> Already Have An Account? Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Signup Form -->
  <section class="section" style="padding: 3.5rem 0;">
    <div class="container" style="max-width: 600px;">
      <div class="form-card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="width: 64px; height: 64px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem auto;">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h2 style="font-size: 1.65rem; color: var(--dark); font-weight: 800;">Patient Registration</h2>
          <p style="color: var(--gray-600); font-size: 0.92rem; margin-top: 0.25rem;">Create your medical profile to schedule consultations and view digital prescriptions.</p>
        </div>

        <form id="patSignupForm">
          <div class="form-group">
            <label class="form-label">Full Legal Name *</label>
            <input type="text" id="regPatName" class="form-control" placeholder="e.g. Liam Foster" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Email Address *</label>
              <input type="email" id="regPatEmail" class="form-control" placeholder="liam.foster@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label">Contact Phone *</label>
              <input type="tel" id="regPatPhone" class="form-control" placeholder="+1 (555) 000-0000" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Create Password *</label>
              <input type="password" id="regPatPass" class="form-control" placeholder="Create secure password" required minlength="4">
            </div>
            <div class="form-group">
              <label class="form-label">Blood Group</label>
              <select id="regPatBlood" class="form-select">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+" selected>O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Age</label>
              <input type="number" id="regPatAge" class="form-control" placeholder="32" min="1" max="120" required>
            </div>
            <div class="form-group">
              <label class="form-label">Gender</label>
              <select id="regPatGender" class="form-select">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.25rem;">
            <i class="fa-solid fa-user-check"></i> Register Patient Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-200); font-size: 0.9rem; color: var(--gray-600);">
          Already have an account? <a id="linkBottomLogin" href="patient-login.html" style="font-weight: 600; color: var(--primary);">Sign In Here</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Read redirect params if present
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get("redirect");
    const prefillName = urlParams.get("name");
    const prefillPhone = urlParams.get("phone");

    if (prefillName) document.getElementById("regPatName").value = decodeURIComponent(prefillName);
    if (prefillPhone) document.getElementById("regPatPhone").value = decodeURIComponent(prefillPhone);

    if (redirectUrl) {
      document.getElementById("linkLogin").href = `patient-login.html?redirect=${encodeURIComponent(redirectUrl)}`;
      document.getElementById("linkBottomLogin").href = `patient-login.html?redirect=${encodeURIComponent(redirectUrl)}`;
    }

    document.getElementById("patSignupForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const patientData = {
        name: document.getElementById("regPatName").value,
        email: document.getElementById("regPatEmail").value,
        phone: document.getElementById("regPatPhone").value,
        password: document.getElementById("regPatPass").value,
        bloodGroup: document.getElementById("regPatBlood").value,
        age: document.getElementById("regPatAge").value,
        gender: document.getElementById("regPatGender").value
      };

      const result = window.app.registerPatient(patientData);
      if (result.success) {
        window.app.showToast("Account created successfully! Welcome to Clinic On.");
        setTimeout(() => {
          if (redirectUrl) {
            window.location.href = decodeURIComponent(redirectUrl);
          } else {
            window.location.href = "patient-dashboard.html";
          }
        }, 500);
      } else {
        window.app.showToast(result.message || "Registration failed.", true);
      }
    });
  </script>
</body>
</html>
